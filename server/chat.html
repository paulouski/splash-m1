<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splash</title>
<link rel="stylesheet" href="/static/katex/katex.min.css">
<script defer src="/static/katex/katex.min.js"></script>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
  * { box-sizing: border-box }
  :root {
    color-scheme: light dark;
    --sidebar: 260px;
    --bg: #fff;
    --side: #f9f9f9;
    --text: #171717;
    --muted: #727272;
    --hover: #ececec;
    --bubble: #f1f1f1;
    --composer: #fff;
    --border: #e5e5e5;
    --shadow: 0 8px 28px #00000012;
    --link: #0b6bcb;
    --code: #f7f7f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --side: #181818;
      --text: #ececec;
      --muted: #9b9b9b;
      --hover: #2b2b2b;
      --bubble: #303030;
      --composer: #2f2f2f;
      --border: #424242;
      --shadow: 0 8px 28px #0005;
      --link: #6cb0ff;
      --code: #1a1a1a;
    }
  }
  body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
  button, input, textarea, select { color: inherit; font: inherit }
  button { border: 0; background: none; cursor: pointer }
  button:disabled { cursor: default; opacity: .45 }
  svg { display: block }

  aside { position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; flex-direction: column; overflow: hidden auto; width: var(--sidebar); padding: 12px 8px; background: var(--side); border-right: 1px solid var(--border) }
  aside > * { flex: none }
  .brand { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 10px; font-size: 17px; font-weight: 650; letter-spacing: -.02em }
  .brand img { width: 19px; height: 19px }
  #new-chat { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 9px; padding: 9px 10px; border-radius: 9px; text-align: left }
  #new-chat:hover { background: var(--hover) }
  #new-chat svg { width: 18px; height: 18px }
  .recent-label { margin: 22px 10px 7px; color: var(--muted); font-size: 12px; font-weight: 600 }
  #recents { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px }
  .recent { display: flex; align-items: center; gap: 2px; width: 100%; padding: 8px 6px 8px 10px; border-radius: 9px; cursor: pointer }
  .recent:hover, .recent.active { background: var(--hover) }
  .recent.disabled { opacity: .45; pointer-events: none }
  .recent-title { overflow: hidden; flex: 1; min-width: 0; text-overflow: ellipsis; white-space: nowrap }
  .row-btn { display: none; flex: none; width: 24px; height: 24px; border-radius: 6px; color: var(--muted); line-height: 1 }
  .row-btn:hover { color: var(--text); background: var(--border) }
  .recent:hover .row-btn, .recent:focus-within .row-btn { display: block }
  .rename-input { flex: 1; min-width: 0; padding: 0 4px; border: 1px solid var(--border); border-radius: 5px; outline: 0; background: var(--bg) }

  #model-panel { margin: auto 4px 0; padding: 10px 6px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.35 }
  #model-status { display: flex; align-items: center; gap: 8px; padding: 0 4px }
  #model-text { flex: 1; min-width: 0 }
  #model-sub { min-height: 1.35em; padding: 2px 4px 0 20px }
  .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 0 4px }
  .idle-pick { position: relative; display: flex; align-items: center; padding: 3px 18px 3px 7px; border: 1px solid var(--border); border-radius: 7px }
  .idle-pick::after { position: absolute; right: 6px; content: '\2304'; font-size: 10px; pointer-events: none }
  .idle-pick select { color: var(--text); font-size: 12px }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #9b9b9b }
  .dot.ok { background: #2fb457 }
  .dot.busy { background: #f0a020 }
  .dot.down { background: #d33 }
  #ctx { position: fixed; top: 12px; right: 18px; z-index: 8; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px }
  #ctx[hidden] { display: none }
  .ctx-bar { width: 72px; height: 4px; overflow: hidden; border-radius: 2px; background: var(--border) }
  .ctx-bar i { display: block; height: 100%; background: #2fb457 }
  #ctx.warn .ctx-bar i { background: #f0a020 }
  #ctx.crit .ctx-bar i { background: #d33 }
  #jump { position: fixed; bottom: 92px; left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); z-index: 9; width: 34px; height: 34px; transform: translateX(-50%); border: 1px solid var(--border); border-radius: 50%; background: var(--composer); box-shadow: var(--shadow); font-size: 17px; line-height: 1 }
  #jump[hidden] { display: none }
  .credentials { display: block; margin: 12px 0 0; color: var(--muted); font-size: 12px }
  #api-key { width: 100%; margin-top: 6px; padding: 6px 8px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px }

  main { min-height: 100vh; margin-left: var(--sidebar) }
  #chat { width: min(760px, 100%); margin: auto; padding: 38px 20px 150px }
  #empty { position: fixed; top: calc(50% - 58px); left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); transform: translateX(-50%); font-size: 25px; font-weight: 600; letter-spacing: -.025em }
  .message { margin: 28px 0; white-space: pre-wrap; overflow-wrap: anywhere }
  .user { position: relative; width: fit-content; max-width: 80%; margin-left: auto; padding: 10px 16px; border-radius: 20px; background: var(--bubble) }
  .user-images { display: flex; flex-wrap: wrap; gap: 8px }
  .user-text + .user-images { margin-top: 9px }
  .user-images img { display: block; width: min(240px, 100%); max-height: 240px; border-radius: 12px; object-fit: cover }
  .assistant { padding: 0 4px; white-space: normal }
  .edit-msg { position: absolute; top: 100%; right: 8px; padding: 0 6px; border-radius: 6px; color: var(--muted); font-size: 14px; opacity: 0 }
  .user:hover .edit-msg, .edit-msg:focus-visible { opacity: 1 }
  .edit-msg:hover { color: var(--text); background: var(--hover) }
  @media (hover: none) { .edit-msg { opacity: .6 } .row-btn { display: block } }
  .user.editing { width: 100%; max-width: 100%; border-radius: 14px }
  .editor textarea { max-height: 300px; padding: 8px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--bg) }
  .editor .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px }
  .btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px }
  .btn.primary { color: var(--bg); background: var(--text); border-color: var(--text) }
  .waiting { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  details { margin-bottom: 12px; color: var(--muted); font-size: 14px }
  summary { width: fit-content; cursor: pointer; user-select: none; font-weight: 500 }
  .reasoning { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--border); white-space: pre-wrap }
  .stats { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.4 }
  .actions { display: flex; gap: 4px; margin-top: 6px }
  .action { padding: 3px 8px; border-radius: 7px; color: var(--muted); font-size: 12px }
  .action:hover { color: var(--text); background: var(--hover) }

  .content .katex { font-size: 1.1em }
  .content .katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden }
  .math-raw { white-space: pre-wrap }
  .content > :first-child { margin-top: 0 }
  .content > :last-child { margin-bottom: 0 }
  .content p, .content ul, .content ol, .content blockquote, .content .code, .content .table-wrap { margin: 0 0 .8em }
  .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { margin: 1.1em 0 .5em; line-height: 1.3 }
  .content h1 { font-size: 1.5em } .content h2 { font-size: 1.3em } .content h3 { font-size: 1.15em } .content h4, .content h5, .content h6 { font-size: 1em }
  .content ul, .content ol { padding-left: 1.6em }
  .content li > p { margin: 0 } .content li > p + p { margin-top: .5em }
  .content li > ul, .content li > ol { margin: .25em 0 0 }
  .content li + li { margin-top: .25em }
  .content blockquote { padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted) }
  .content hr { margin: 1em 0; border: 0; border-top: 1px solid var(--border) }
  .content a { color: var(--link) }
  code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace }
  :not(pre) > code { padding: .1em .35em; border-radius: 5px; background: var(--bubble) }
  .code { overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--code) }
  .code-head { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px 3px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px }
  .code pre { margin: 0; padding: 10px 12px; overflow-x: auto; white-space: pre; overflow-wrap: normal; tab-size: 4 }
  .table-wrap { overflow-x: auto }
  table { border-collapse: collapse }
  th, td { padding: 6px 12px; border: 1px solid var(--border); overflow-wrap: normal; vertical-align: top }
  th { background: var(--bubble) }
  .error { color: #d33 }

  form { position: fixed; left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 10; display: flex; align-items: flex-end; gap: 8px; width: min(720px, calc(100vw - var(--sidebar) - 28px)); min-height: 54px; transform: translateX(-50%); padding: 9px; border: 1px solid var(--border); border-radius: 28px; background: var(--composer); box-shadow: var(--shadow) }
  body.empty form { top: 50%; bottom: auto }
  .composer { min-width: 0; flex: 1 }
  #attachments { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px }
  #attachments:empty { display: none }
  .attachment { position: relative; width: 58px; height: 58px; flex: none }
  .attachment img, .attachment-status { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 12px; object-fit: cover }
  .attachment-status { display: grid; place-items: center; padding: 4px; background: var(--bubble); text-align: center; font-size: 11px; line-height: 1.2 }
  .remove-image { position: absolute; top: -5px; right: -5px; display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; color: #fff; background: #333; font-size: 15px; line-height: 1 }
  textarea { display: block; width: 100%; max-height: 180px; padding: 6px 0; resize: none; border: 0; outline: 0; background: transparent }
  textarea::placeholder { color: var(--muted) }
  .toolbar { display: flex; flex: none; align-items: center; gap: 5px }
  #attach[hidden] { display: none }
  #attach { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; color: var(--muted) }
  #attach:hover { color: var(--text); background: var(--hover) }
  .effort { position: relative; display: flex; align-items: center; gap: 5px; padding: 5px 21px 5px 8px; border-radius: 10px; color: var(--muted); font-size: 13px; line-height: 24px }
  .effort:hover, .effort:focus-within { color: var(--text); background: var(--hover) }
  .effort::after { position: absolute; right: 8px; content: '\2304'; font-size: 11px; pointer-events: none }
  .web-toggle { padding: 5px 8px; border-radius: 10px; color: var(--muted); font-size: 13px; line-height: 24px; white-space: nowrap }
  .web-toggle:hover, .web-toggle[aria-pressed="true"] { color: var(--text); background: var(--hover) }
  .web-toggle[aria-pressed="false"] { opacity: .75 }
  .steps { color: var(--muted); font-size: 13px; line-height: 1.6 }
  .steps:empty { display: none }
  .sources { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.6 }
  .sources a { margin-right: 10px; color: inherit; text-decoration: underline }
  select { appearance: none; padding: 0; border: 0; outline: 0; background: transparent; cursor: pointer }
  #gear { display: flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 8px; color: var(--muted); font-size: 12px; line-height: 20px }
  #gear:hover, #gear[aria-expanded="true"] { color: var(--text); background: var(--hover) }
  #settings { position: fixed; left: calc(var(--sidebar) + 10px); bottom: 12px; z-index: 30; width: min(360px, calc(100vw - 24px)); max-height: 80vh; overflow: auto; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--composer); box-shadow: var(--shadow); font-size: 13px; line-height: 1.4 }
  #settings[hidden] { display: none }
  .presets { display: flex; flex-wrap: wrap; gap: 6px }
  .field { display: grid; grid-template-columns: 82px 1fr 64px; align-items: center; gap: 8px; margin: 10px 0 0 }
  .field.wide input { grid-column: 2 / 4 }
  .field input[type="range"] { width: 100%; min-width: 0 }
  #settings input[type="number"], #settings textarea { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; outline: 0; background: var(--bg) }
  #settings textarea { min-height: 84px; max-height: 240px; margin-top: 10px; padding: 6px 8px; border-radius: 8px; resize: vertical }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px }
  .hint[hidden] { display: none }
  #send { width: 34px; height: 34px; flex: none; border-radius: 50%; color: var(--bg); background: var(--text); font-size: 17px }
  #send:disabled { color: var(--muted); background: var(--hover) }
  #mobile-header, #scrim { display: none }

  @media (max-width: 720px) {
    :root { --sidebar: 0px }
    aside { width: 260px; transform: translateX(-100%); transition: transform .18s ease }
    body.menu-open aside { transform: none }
    #scrim { position: fixed; inset: 0; z-index: 15; background: #0005 }
    body.menu-open #scrim { display: block }
    #mobile-header { position: fixed; inset: 0 0 auto; z-index: 12; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px) }
    #menu, #mobile-new { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px }
    #menu:hover, #mobile-new:hover { background: var(--hover) }
    #mobile-header .brand { padding: 0; font-size: 16px }
    #chat { padding: 66px 16px 140px }
    #empty { top: calc(50% - 58px); left: 50%; font-size: 23px }
    form { left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); width: calc(100% - 16px) }
    #jump { left: 50%; bottom: 84px }
    #ctx { top: 60px; right: 12px }
    #settings { left: 12px }
    textarea { max-height: 140px }
  }
  @media (max-width: 430px) {
    .effort { padding-left: 5px }
    .effort > span { display: none }
    .web-toggle > span { display: none }
    .user { max-width: 88% }
  }
</style>

<aside id="sidebar">
  <div class="brand">
    <img src="/favicon.ico" alt="">
    Splash
  </div>
  <button id="new-chat" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="m15 4 5 5M14 10l6-6"/></svg>
    New chat
  </button>
  <div class="recent-label">Recents</div>
  <nav id="recents" aria-label="Recent chats"></nav>
  <div id="model-panel">
    <div id="model-status" role="status"><span id="model-dot" class="dot"></span><span id="model-text">Checking…</span></div>
    <div id="model-sub"></div>
    <div class="panel-row">
      <label class="idle-pick">Unload after&nbsp;
        <select id="idle-select" aria-label="Idle unload timeout">
          <option value="0">Never</option>
          <option value="60">1 min</option>
          <option value="120">2 min</option>
          <option value="300">5 min</option>
          <option value="600">10 min</option>
          <option value="1800">30 min</option>
        </select>
      </label>
      <button id="gear" type="button" aria-label="Generation settings" title="Generation settings" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span id="gear-label"></span>
      </button>
    </div>
  </div>
</aside>
<div id="scrim"></div>
<header id="mobile-header">
  <button id="menu" type="button" aria-label="Open sidebar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">Splash</div>
  <button id="mobile-new" type="button" aria-label="New chat"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="m15 4 5 5M14 10l6-6"/></svg></button>
</header>
<div id="ctx" title="Context used by the last turn" hidden><span id="ctx-text"></span><span class="ctx-bar"><i id="ctx-fill"></i></span></div>
<main><div id="chat"></div></main>
<button id="jump" type="button" aria-label="Scroll to bottom" title="Scroll to bottom" hidden>&darr;</button>
<form id="form">
  <button id="attach" type="button" aria-label="Add images" title="Add images">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <input id="image-input" type="file" accept="image/*" multiple hidden>
  <div class="composer">
    <div id="attachments" aria-label="Attached images"></div>
    <textarea id="input" rows="1" placeholder="Message Splash" autofocus></textarea>
  </div>
  <div class="toolbar">
    <button id="web" type="button" class="web-toggle" aria-pressed="false" title="Search the web (DuckDuckGo): the model can search and read one page">&#127760;<span> Web</span></button>
    <label class="effort"><span>Thinking</span>
      <select id="effort" aria-label="Thinking effort">
        <option value="">Default</option>
        <option value="xhigh">XHigh</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
        <option value="none">Off</option>
      </select>
    </label>
    <button id="send" aria-label="Send">&#8593;</button>
  </div>
</form>
  <div id="settings" role="dialog" aria-label="Generation settings" hidden>
    <div class="presets">
      <button id="preset-precise" type="button" class="btn">Precise</button>
      <button id="preset-balance" type="button" class="btn">Balanced</button>
      <button id="preset-creative" type="button" class="btn">Creative</button>
      <button id="preset-reset" type="button" class="btn">Reset</button>
    </div>
    <label class="field">Temperature <input id="s-temperature" type="range" min="0" max="2" step="0.05"><input id="s-temperature-n" type="number" min="0" max="2" step="0.05"></label>
    <label class="field">Top P <input id="s-top_p" type="range" min="0.05" max="1" step="0.05"><input id="s-top_p-n" type="number" min="0.05" max="1" step="0.05"></label>
    <label class="field">Top K <input id="s-top_k" type="range" min="1" max="32" step="1"><input id="s-top_k-n" type="number" min="1" max="32" step="1"></label>
    <label class="field wide">Max tokens <input id="s-max_tokens-n" type="number" min="1" step="1" placeholder="server default"></label>
    <label class="field wide">Seed <input id="s-seed-n" type="number" min="0" step="1" placeholder="random"></label>
    <textarea id="s-system" rows="4" placeholder="System prompt (this chat)" aria-label="System prompt"></textarea>
    <p id="s-system-hint" class="hint" hidden>Changing the system prompt clears this chat's prefix cache. The next response will read the conversation history again.</p>
    <p class="hint"><button id="s-system-default" type="button" class="action">Set as default for new chats</button></p>
    <label class="credentials">API key (if required)
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" aria-label="API key">
    </label>
  </div>

<script>
  const $ = selector => document.querySelector(selector);
  const chat = $('#chat');
  const form = $('#form');
  const input = $('#input');
  const attachmentsBox = $('#attachments');
  const imageInput = $('#image-input');
  const attach = $('#attach');
  const effort = $('#effort');
  const webButton = $('#web');
  const apiKey = $('#api-key');
  const send = $('#send');
  const recents = $('#recents');
  const jump = $('#jump');
  const modelDot = $('#model-dot');
  const modelText = $('#model-text');
  const modelSub = $('#model-sub');
  const idleSelect = $('#idle-select');
  const ctxBox = $('#ctx');
  const ctxText = $('#ctx-text');
  const ctxFill = $('#ctx-fill');
  const storeKey = 'splash-chats';
  const effortKey = 'splash-thinking-effort';
  const allowedEfforts = new Set([...effort.options].map(option => option.value));
  const statKeys = ['reasoning_s', 'ttft_ms', 'prefill_tps', 'decode_tps', 'prompt', 'completion', 'cached', 'reasoning', 'elapsed_s', 'approx_tps', 'search_s'];
  let conversations = load();
  let activeId = null;
  let messages = [];
  let attachments = [];
  let controller;
  // Until /v1/models says otherwise; a text-only model takes no images.
  let imagesAccepted = true;
  // Follow the bottom while streaming until the user scrolls away from it.
  let follow = true;
  let lastY = 0;
  let modelState = '';
  // Set while a request waits for the first token of a model that was not loaded.
  let loadingSince = 0;
  // Idle-unload timeout in seconds (0 = never) and when the engine unloads, from /splash/settings.
  let idleSeconds = null;
  let unloadAt = 0;
  // Context window in tokens; /v1/models replaces this default.
  let contextLimit = 32768;

  const gear = $('#gear');
  const gearLabel = $('#gear-label');
  const settings = $('#settings');
  const systemInput = $('#s-system');
  const systemHint = $('#s-system-hint');
  const samplingKey = 'splash-sampling';
  const systemKey = 'splash-system-default';
  // Server defaults (server/frontend.py); a value equal to its default is not sent.
  const serverDefaults = {temperature: 1, top_p: 0.95, top_k: 20};
  const presets = {
    precise: {temperature: 0.3, top_p: 0.9, top_k: 20},
    balance: {temperature: 0.7, top_p: 0.95, top_k: 20},
    creative: {temperature: 1, top_p: 0.95, top_k: 20}
  };
  // Ranges the server accepts (top_k is capped at 32 there).
  const fields = {
    temperature: {min: 0, max: 2},
    top_p: {min: 0.05, max: 1},
    top_k: {min: 1, max: 32, int: true},
    max_tokens: {min: 1, max: Infinity, int: true},
    seed: {min: 0, max: Number.MAX_SAFE_INTEGER, int: true}
  };

  function clampField(key, raw) {
    if (raw === null || raw === undefined || raw === '') return null;
    const number = Number(raw);
    if (!Number.isFinite(number)) return null;
    const {min, max, int} = fields[key];
    const clamped = Math.min(max, Math.max(min, number));
    return int ? Math.round(clamped) : Math.round(clamped * 100) / 100;
  }

  function loadSampling() {
    let stored = null;
    try { stored = JSON.parse(storageGet(samplingKey)); } catch { /* Fall back to the default preset. */ }
    if (!stored || typeof stored !== 'object') stored = null;
    const sampling = {};
    for (const key of Object.keys(fields)) {
      // A new install starts on Balanced: a lower temperature raises speculative-draft acceptance, so decoding is faster.
      const fallback = key in serverDefaults ? (stored ? serverDefaults[key] : presets.balance[key]) : null;
      sampling[key] = clampField(key, stored?.[key]) ?? fallback;
    }
    return sampling;
  }

  const sampling = loadSampling();
  let system = storageGet(systemKey) || '';
  // Per chat: the model may search the web and read one page (server/web_tools.py).
  let web = false;
  const webHint = 'Use web_search and read_page when a question needs fresh or external information. Search first, then use read_page to read at most one relevant result selected by its title and description. Cite the source URL in your answer. You can make up to 2 searches and read 1 page per answer. If your knowledge is sufficient, answer without searching. Reply in the same language as the user.';
  const webTools = [
    {type: 'function', function: {name: 'web_search', description: 'Search the web with DuckDuckGo for up to 8 results with titles, URLs, and snippets.',
      parameters: {type: 'object', properties: {query: {type: 'string', description: 'Search query'}}, required: ['query']}}},
    {type: 'function', function: {name: 'read_page', description: 'Read one page from a search result URL (at most one page per answer).',
      parameters: {type: 'object', properties: {url: {type: 'string', description: 'HTTP or HTTPS URL from the results'}}, required: ['url']}}}
  ];
  const maxSearches = 2;
  const maxReads = 1;
  const maxRounds = 5;

  const savedEffort = storageGet(effortKey);
  effort.value = allowedEfforts.has(savedEffort) ? savedEffort : '';

  function authorization() {
    return apiKey.value ? {Authorization: `Bearer ${apiKey.value}`} : {};
  }

  async function loadModalities() {
    try {
      const response = await fetch('/v1/models', {headers: authorization()});
      if (!response.ok) return;
      const model = (await response.json()).data?.[0];
      if (Number.isFinite(model?.context_length) && model.context_length > 0) {
        contextLimit = model.context_length;
        showContext();
      }
      const modalities = model?.input_modalities;
      if (!Array.isArray(modalities)) return;
      imagesAccepted = modalities.includes('image');
      attach.hidden = !imagesAccepted;
      if (!imagesAccepted) clearAttachments();
    } catch { /* The server still rejects input the model cannot take. */ }
  }

  const modelStates = {
    loaded: ['ok', 'Model loaded'],
    unloaded: ['idle', 'Unloaded (will load when requested, ~30 s)'],
    loading: ['busy', 'Loading…'],
    down: ['down', 'Unavailable'],
    auth: ['idle', 'API key required']
  };

  function showModel(state) {
    modelState = state;
    if (state !== 'loading') loadingSince = 0;
    modelDot.className = `dot ${modelStates[state][0]}`;
    modelText.textContent = modelStates[state][1];
    paintPanel();
  }

  const spanText = value => `${Math.ceil(value)} s`;

  // The panel's live parts: the cold-start wait and the idle-unload countdown.
  function paintPanel() {
    if (loadingSince) modelText.textContent = `Loading… ${Math.floor((Date.now() - loadingSince) / 1000)} s`;
    const left = (unloadAt - Date.now()) / 1000;
    modelSub.textContent = modelState === 'loaded' && !controller && unloadAt && left > 0 ? `Unloads in ${spanText(left)}` : '';
  }

  function showIdle(settings) {
    if (!Number.isFinite(settings?.idle_unload_seconds)) return;
    idleSeconds = settings.idle_unload_seconds;
    unloadAt = Number.isFinite(settings.unload_in_seconds) ? Date.now() + settings.unload_in_seconds * 1000 : 0;
    const value = String(idleSeconds);
    if (![...idleSelect.options].some(option => option.value === value)) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = spanText(idleSeconds);
      idleSelect.append(option);
    }
    idleSelect.value = value;
    paintPanel();
  }

  async function saveIdle() {
    const previous = idleSeconds;
    try {
      const response = await fetch('/splash/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...authorization()},
        body: JSON.stringify({idle_unload_seconds: Number(idleSelect.value)})
      });
      if (!response.ok) throw new Error(response.statusText);
      showIdle(await response.json());
    } catch {
      idleSelect.value = String(previous);
      modelSub.textContent = 'Could not save';
    }
  }

  // /status only reads the engine's state; it neither reloads the model nor counts as activity.
  function modelStateOf(status) {
    const transport = status?.transport;
    if (!transport) return 'down';
    if (transport.unloaded) return 'unloaded';
    if (transport.ready) return 'loaded';
    return transport.recovering ? 'loading' : 'down';
  }

  async function pollModel() {
    if (controller || document.hidden) return;
    let state;
    try {
      const response = await fetch('/status', {headers: authorization()});
      state = response.status === 401 ? 'auth' : response.ok ? modelStateOf(await response.json()) : 'down';
    } catch { state = 'down'; }
    if (controller) return;
    showModel(state);
    if (state === 'auth' || state === 'down') return;
    // Same 5 s cadence as the status poll; the countdown then ticks locally.
    try {
      const response = await fetch('/splash/settings', {headers: authorization()});
      if (response.ok && !controller) showIdle(await response.json());
    } catch { /* The panel keeps its last known value. */ }
  }

  const bottomGap = () => document.documentElement.scrollHeight - innerHeight - scrollY;

  function toBottom() {
    follow = true;
    jump.hidden = true;
    scrollTo(0, document.documentElement.scrollHeight);
  }

  function onScroll() {
    if (bottomGap() < 40) follow = true;
    else if (scrollY < lastY) follow = false;
    lastY = scrollY;
    jump.hidden = follow || !controller;
  }

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    }
    catch { return null; }
  }

  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    }
    catch { /* Chat still works if browser storage is full or disabled. */ return false; }
  }

  function cleanUserContent(content) {
    if (typeof content === 'string') return content;
    if (!Array.isArray(content)) return null;
    const clean = content.flatMap(part => {
      if (part?.type === 'text' && typeof part.text === 'string') return [{type: 'text', text: part.text}];
      const url = part?.type === 'image_url' ? part.image_url?.url : null;
      return typeof url === 'string' && url.startsWith('data:image/') ? [{type: 'image_url', image_url: {url}}] : [];
    });
    return clean.length ? clean : null;
  }


  function cleanStats(stats) {
    if (!stats || typeof stats !== 'object') return null;
    const clean = {};
    statKeys.forEach(key => { if (Number.isFinite(stats[key]) && stats[key] > 0) clean[key] = stats[key]; });
    if (stats.finish === 'length') clean.finish = 'length';
    if (stats.stopped === true) clean.stopped = true;
    return Object.keys(clean).length ? clean : null;
  }

  function cleanCalls(calls) {
    if (!Array.isArray(calls)) return [];
    return calls.flatMap(call => {
      const fn = call?.function;
      return typeof call?.id === 'string' && typeof fn?.name === 'string' && typeof fn.arguments === 'string'
        ? [{id: call.id, type: 'function', function: {name: fn.name, arguments: fn.arguments}}] : [];
    });
  }

  function cleanSources(sources) {
    if (!Array.isArray(sources)) return [];
    return sources.flatMap(source => typeof source?.url === 'string' && /^https?:\/\//i.test(source.url)
      ? [{title: typeof source.title === 'string' ? source.title : '', url: source.url}] : []);
  }

  function cleanMessage(message) {
    if (message?.role === 'tool') {
      return typeof message.content === 'string' && typeof message.tool_call_id === 'string'
        ? {role: 'tool', tool_call_id: message.tool_call_id, content: message.content} : null;
    }
    if (!message || !['user', 'assistant'].includes(message.role)) return null;
    const content = message.role === 'user' ? cleanUserContent(message.content) : message.content;
    if (content === null || (message.role === 'assistant' && typeof content !== 'string')) return null;
    const clean = {role: message.role, content};
    if (message.role === 'assistant' && typeof message.reasoning_content === 'string') clean.reasoning_content = message.reasoning_content;
    if (message.role === 'assistant' && Number.isFinite(message.tps) && message.tps > 0) clean.tps = message.tps;
    const stats = message.role === 'assistant' ? cleanStats(message.stats) : null;
    if (stats) clean.stats = stats;
    if (message.role === 'assistant') {
      const calls = cleanCalls(message.tool_calls);
      if (calls.length) clean.tool_calls = calls;
      const sources = cleanSources(message.sources);
      if (sources.length) clean.sources = sources;
    }
    return clean;
  }

  function load() {
    try {
      const stored = JSON.parse(storageGet(storeKey));
      if (!Array.isArray(stored)) return [];
      const seen = new Set();
      return stored.flatMap(conversation => {
        if (!conversation || typeof conversation.id !== 'string' || seen.has(conversation.id) ||
            typeof conversation.title !== 'string' || !Number.isFinite(conversation.updated) ||
            !Array.isArray(conversation.messages)) return [];
        const messages = conversation.messages.map(cleanMessage).filter(Boolean);
        if (!messages.length) return [];
        seen.add(conversation.id);
        return [{id: conversation.id, title: conversation.title, updated: conversation.updated, messages,
          system: typeof conversation.system === 'string' ? conversation.system : '', web: conversation.web === true}];
      });
    } catch { return []; }
  }

  function hasImages(conversation) {
    return conversation.messages.some(message => Array.isArray(message.content) &&
      message.content.some(part => part.type === 'image_url'));
  }

  function withoutImages(conversation) {
    const messages = conversation.messages.map(message => Array.isArray(message.content) ? {
      ...message,
      content: message.content.map(part => part.type === 'image_url' ? {type: 'text', text: '[Image not saved]'} : part)
    } : message);
    return {...conversation, messages};
  }

  function save() {
    conversations.sort((a, b) => b.updated - a.updated);
    conversations = conversations.slice(0, 100);
    // Browser storage holds a few MB per site, which one photo can fill. Rather
    // than fail every later save, store the newest chats that fit, each with its
    // images if they still fit and without them otherwise, so a photo too large
    // to store does not cost older chats theirs. The open page keeps its images.
    if (!storageSet(storeKey, JSON.stringify(conversations))) {
      const stored = [];
      for (const conversation of conversations) {
        const candidates = hasImages(conversation) ? [conversation, withoutImages(conversation)] : [conversation];
        const fitting = candidates.find(candidate => storageSet(storeKey, JSON.stringify([...stored, candidate])));
        if (!fitting) break;
        stored.push(fitting);
      }
    }
    renderRecents();
  }

  function titleFor(text) {
    const title = text.replace(/\s+/g, ' ').trim();
    if (title.length <= 50) return title;
    const cut = title.slice(0, 50);
    const space = cut.lastIndexOf(' ');
    return `${(space > 20 ? cut.slice(0, space) : cut).trimEnd()}…`;
  }

  // crypto.randomUUID exists only in secure contexts, which excludes a LAN
  // address over plain HTTP; getRandomValues works everywhere.
  function chatId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)),
      byte => byte.toString(16).padStart(2, '0')).join('');
  }

  function userParts(content) {
    if (typeof content === 'string') return {text: content, images: []};
    return {
      text: content.filter(part => part.type === 'text').map(part => part.text).join('\n'),
      images: content.filter(part => part.type === 'image_url').map(part => part.image_url.url)
    };
  }

  // The system message always leads the history, so the prefix stays identical between turns.
  function requestMessages() {
    const history = messages.map(({tps, stats, sources, ...message}) => message);
    // The hint stays whenever the chat has web on, so the prefix is identical between turns.
    const text = web ? (system.trim() ? `${system}\n\n${webHint}` : webHint) : system;
    return text.trim() ? [{role: 'system', content: text}, ...history] : history;
  }

  function requestBody(tools = web) {
    const body = {messages: requestMessages(), stream: true, stream_options: {include_usage: true}, ...(effort.value ? {reasoning_effort: effort.value} : {})};
    if (tools) body.tools = webTools;
    for (const key of Object.keys(serverDefaults)) if (sampling[key] !== serverDefaults[key]) body[key] = sampling[key];
    if (sampling.max_tokens !== null) body.max_tokens = sampling.max_tokens;
    if (sampling.seed !== null) body.seed = sampling.seed;
    return body;
  }

  function showSampling() {
    gearLabel.textContent = `T ${sampling.temperature}`;
    for (const key of Object.keys(fields)) {
      const range = $(`#s-${key}`);
      if (range) range.value = sampling[key];
      $(`#s-${key}-n`).value = sampling[key] ?? '';
    }
  }

  function changeSampling(values) {
    Object.assign(sampling, values);
    storageSet(samplingKey, JSON.stringify(sampling));
    showSampling();
  }

  function showSystem() {
    systemInput.value = system;
    systemHint.hidden = true;
  }

  function displayContent(content) {
    // Remove surrounding blank lines without stripping the first line's indentation.
    return content.replace(/^(?:[ \t]*\r?\n)+|(?:\r?\n[ \t]*)+$/g, '');
  }

  // Markdown renderer: every piece of model text goes through escapeHtml before any
  // tag is produced, and links are limited to http(s), so no model HTML survives.
  const escapeHtml = text => text.replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));

  function emphasis(text) {
    return text
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\p{L}\p{N}_])__(?=\S)([\s\S]*?\S)__(?![\p{L}\p{N}_])/gu, '$1<strong>$2</strong>')
      .replace(/(^|[^*])\*(?=[^\s*])([^*\n]*[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^\p{L}\p{N}_])_(?=[^\s_])([^_\n]*[^\s_])_(?![\p{L}\p{N}_])/gu, '$1<em>$2</em>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
  }

  function inlineMarkdown(text) {
    // Code spans, escapes and links are stashed as NUL-delimited tokens so later rules cannot touch them.
    const stash = [];
    const hold = html => `\u0000${stash.push(html) - 1}\u0000`;
    let out = text.replace(/\u0000/g, '')
      .replace(/(`+)([^`](?:[\s\S]*?[^`])?)\1(?!`)/g, (_, ticks, code) => hold(`<code>${escapeHtml(code.trim())}</code>`))
      .replace(/\\([\\`*_{}\[\]()#+\-.!|~>])/g, (_, char) => hold(escapeHtml(char)))
      .replace(/<br\s*\/?>/gi, () => hold('<br>'));
    out = escapeHtml(out).replace(/\[([^\[\]]+)\]\(\s*(https?:\/\/[^\s)\u0000]+)(?:\s+&quot;[^\u0000]*?&quot;)?\s*\)/gi,
      (_, label, url) => hold(`<a href="${url}" target="_blank" rel="noopener noreferrer">${emphasis(label)}</a>`));
    out = emphasis(out).replace(/\n/g, '<br>');
    while (/\u0000\d+\u0000/.test(out)) out = out.replace(/\u0000(\d+)\u0000/g, (_, index) => stash[index]);
    return out;
  }

  const fenceRe = /^ {0,3}(`{3,}|~{3,})[ \t]*([^\s`]*)[^`]*$/;
  const headingRe = /^ {0,3}(#{1,6})[ \t]+(.*?)(?:[ \t]+#+)?[ \t]*$/;
  const hrRe = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
  const listRe = /^( *)([-*+]|\d{1,9}[.)])[ \t]+(.*)$/;
  const quoteRe = /^ {0,3}>[ \t]?(.*)$/;
  const tableSepRe = /^ *\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|? *$/;

  function tableCells(line) {
    let row = line.trim().replace(/\\\|/g, '\u0001');
    if (row.startsWith('|')) row = row.slice(1);
    if (row.endsWith('|')) row = row.slice(0, -1);
    return row.split('|').map(cell => cell.replace(/\u0001/g, '|').trim());
  }

  const isTableStart = (line, next) => line.includes('|') && next !== undefined && next.includes('|') &&
    tableSepRe.test(next) && tableCells(line).length === tableCells(next).length;

  const startsBlock = (line, next) => fenceRe.test(line) || headingRe.test(line) || hrRe.test(line) ||
    quoteRe.test(line) || listRe.test(line) || isTableStart(line, next);

  function codeBlock(code, lang) {
    return `<div class="code"><div class="code-head"><span>${escapeHtml(lang)}</span>` +
      `<button type="button" class="action copy-code">Copy</button></div><pre><code>${escapeHtml(code)}</code></pre></div>`;
  }

  function renderBlocks(lines) {
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      let match = fenceRe.exec(line);
      if (match) {
        // An unclosed fence (still streaming) runs to the end as an open code block.
        const close = new RegExp(`^ {0,3}${match[1][0] === '`' ? '`' : '~'}{${match[1].length},}[ \\t]*$`);
        const body = [];
        for (i++; i < lines.length && !close.test(lines[i]); i++) body.push(lines[i]);
        i++;
        out.push(codeBlock(body.join('\n'), match[2]));
      } else if ((match = headingRe.exec(line))) {
        out.push(`<h${match[1].length}>${inlineMarkdown(match[2])}</h${match[1].length}>`);
        i++;
      } else if (hrRe.test(line)) {
        out.push('<hr>');
        i++;
      } else if (quoteRe.test(line)) {
        const inner = [];
        for (; i < lines.length && quoteRe.test(lines[i]); i++) inner.push(quoteRe.exec(lines[i])[1]);
        out.push(`<blockquote>${renderBlocks(inner)}</blockquote>`);
      } else if (isTableStart(line, lines[i + 1])) {
        const align = tableCells(lines[i + 1]).map(cell => {
          const left = cell.startsWith(':'), right = cell.endsWith(':');
          return left && right ? ' style="text-align:center"' : right ? ' style="text-align:right"' : '';
        });
        const head = tableCells(line);
        const cell = (tag, text, index) => `<${tag}${align[index]}>${inlineMarkdown(text || '')}</${tag}>`;
        const rows = [];
        for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes('|') && !fenceRe.test(lines[i]); i++) {
          const cells = tableCells(lines[i]);
          rows.push(`<tr>${head.map((_, index) => cell('td', cells[index], index)).join('')}</tr>`);
        }
        out.push(`<div class="table-wrap"><table><thead><tr>${head.map((text, index) => cell('th', text, index)).join('')}</tr></thead>` +
          `<tbody>${rows.join('')}</tbody></table></div>`);
      } else if ((match = listRe.exec(line))) {
        const base = match[1].length;
        const ordered = /\d/.test(match[2]);
        const start = ordered ? parseInt(match[2], 10) : 1;
        const items = [];
        const sibling = text => {
          const found = listRe.exec(text);
          return found && Math.abs(found[1].length - base) <= 1 && /\d/.test(found[2]) === ordered ? found : null;
        };
        while (i < lines.length) {
          const item = sibling(lines[i]);
          if (!item) break;
          const inner = [item[3]];
          const width = base + item[2].length + 1;
          i++;
          while (i < lines.length) {
            const text = lines[i];
            const indent = text.length - text.trimStart().length;
            if (!text.trim()) {
              let next = i + 1;
              while (next < lines.length && !lines[next].trim()) next++;
              if (next < lines.length && (lines[next].length - lines[next].trimStart().length >= base + 2 && !sibling(lines[next]))) {
                inner.push(...lines.slice(i, next));
                i = next;
              } else break;
            } else if (indent >= base + 2) {
              inner.push(text.slice(Math.min(indent, width)));
              i++;
            } else if (!sibling(text) && !startsBlock(text, lines[i + 1])) {
              inner.push(text);
              i++;
            } else break;
          }
          items.push(`<li>${renderBlocks(inner)}</li>`);
          // A blank line between sibling items does not end the list.
          let next = i;
          while (next < lines.length && !lines[next].trim()) next++;
          if (next < lines.length && sibling(lines[next])) i = next;
        }
        out.push(ordered ? `<ol${start !== 1 ? ` start="${start}"` : ''}>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
      } else {
        const paragraph = [line];
        for (i++; i < lines.length && lines[i].trim() && !startsBlock(lines[i], lines[i + 1]); i++) paragraph.push(lines[i]);
        out.push(`<p>${inlineMarkdown(paragraph.join('\n'))}</p>`);
      }
    }
    return out.join('');
  }

  // Math is cut out before markdown (never from code) and put back as KaTeX output after it.
  const anyFenceRe = /^\s*(`{3,}|~{3,})[ \t]*[^\s`]*[^`]*$/;

  function mathInText(text, put) {
    let out = '';
    let i = 0;
    while (i < text.length) {
      const char = text[i];
      if (char === '`') {
        let n = 1;
        while (text[i + n] === '`') n++;
        const close = new RegExp('(?<!`)`{' + n + '}(?!`)').exec(text.slice(i + n));
        const end = close ? i + n + close.index + n : i + n;
        out += text.slice(i, end);
        i = end;
      } else if (char === '\\') {
        const close = {'[': '\\]', '(': '\\)'}[text[i + 1]];
        const end = close ? text.indexOf(close, i + 2) : -1;
        if (end > 0 && text.slice(i + 2, end).trim()) {
          out += put(text.slice(i + 2, end), text[i + 1] === '[', text.slice(i, end + 2));
          i = end + 2;
        } else {
          out += text.slice(i, i + 2);
          i += 2;
        }
      } else if (char === '$' && text[i + 1] === '$') {
        const end = text.indexOf('$$', i + 2);
        if (end > 0 && text.slice(i + 2, end).trim()) {
          out += put(text.slice(i + 2, end), true, text.slice(i, end + 2));
          i = end + 2;
        } else {
          out += '$$';
          i += 2;
        }
      } else if (char === '$' && text[i + 1] !== undefined && !/\s/.test(text[i + 1])) {
        // Single $ is math only when it hugs its content and the closing $ is not followed by a digit ("$5 and $10").
        let k = i + 1;
        while (k < text.length && text[k] !== '\n' && text[k] !== '$') k += text[k] === '\\' ? 2 : 1;
        if (text[k] === '$' && !/\s/.test(text[k - 1]) && !/\d/.test(text[k + 1] || '')) {
          out += put(text.slice(i + 1, k), false, text.slice(i, k + 1));
          i = k + 1;
        } else {
          out += char;
          i++;
        }
      } else {
        out += char;
        i++;
      }
    }
    return out;
  }

  function extractMath(lines, put) {
    const out = [];
    let chunk = [];
    const flush = () => {
      if (chunk.length) out.push(...mathInText(chunk.join('\n'), put).split('\n'));
      chunk = [];
    };
    for (let i = 0; i < lines.length; i++) {
      const fence = anyFenceRe.exec(lines[i]);
      if (!fence) { chunk.push(lines[i]); continue; }
      flush();
      const close = new RegExp(`^\\s*${fence[1][0] === '`' ? '`' : '~'}{${fence[1].length},}[ \\t]*$`);
      out.push(lines[i]);
      while (++i < lines.length) {
        out.push(lines[i]);
        if (close.test(lines[i])) break;
      }
    }
    flush();
    return out;
  }

  const mathCache = new Map();

  function mathHtml({tex, display, raw}) {
    const key = (display ? 'd' : 'i') + tex;
    if (mathCache.has(key)) return mathCache.get(key);
    if (typeof katex !== 'undefined') {
      try {
        const html = katex.renderToString(tex, {displayMode: display, throwOnError: false, output: 'html', trust: false, strict: 'ignore'});
        if (mathCache.size > 500) mathCache.clear();
        mathCache.set(key, html);
        return html;
      } catch { /* Fall through to the raw TeX. */ }
    }
    return `<code class="math-raw">${escapeHtml(raw)}</code>`;
  }

  function renderMarkdown(source) {
    const math = [];
    // A random per-render token cannot be guessed by model text; stray control characters are dropped.
    const nonce = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    const put = (tex, display, raw) => `\u0002${nonce}:${math.push({tex, display, raw}) - 1}\u0003`;
    const lines = source.replace(/[\u0002\u0003]/g, '').replace(/\r\n?/g, '\n').split('\n');
    const html = renderBlocks(extractMath(lines, put));
    if (!math.length) return html;
    // Tags are matched first so a token that landed inside an attribute is dropped, never expanded.
    return html.replace(new RegExp(`(<[^>]*>)|\u0002${nonce}:(\\d+)\u0003`, 'g'),
      (_, tag, index) => tag ? tag.replace(/[\u0002\u0003]/g, '') : mathHtml(math[index]));
  }

  // Clipboard API needs a secure context; a LAN address over HTTP falls back to execCommand.
  async function copyText(text, button) {
    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.cssText = 'position:fixed;opacity:0';
      document.body.append(area);
      area.select();
      try { copied = document.execCommand('copy'); } catch { /* Nothing more to try. */ }
      area.remove();
    }
    const label = button.textContent;
    button.textContent = copied ? 'Copied' : 'Copy failed';
    setTimeout(() => { button.textContent = label; }, 1200);
  }

  function actionButton(label, onClick, className = 'action') {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = className;
    button.textContent = label;
    button.addEventListener('click', onClick);
    return button;
  }

  const seconds = value => `${(value / 1000).toLocaleString(undefined, {maximumFractionDigits: 1})} s`;
  const rate = value => `${Number(value).toLocaleString(undefined, {maximumFractionDigits: 1})} tok/s`;

  // Streamed text is not tokenized client-side; about 3.3 characters per token is
  // a rough average for mixed Russian/English output, so live rates carry "≈".
  const estimateTokens = message => (message.content.length + (message.reasoning_content || '').length) / 3.3;

  function statsText(message) {
    const stats = message.stats;
    if (!stats) return message.tps ? rate(message.tps) : '';
    const parts = [];
    if (stats.ttft_ms) parts.push(`TTFT ${seconds(stats.ttft_ms)}`);
    if (stats.elapsed_s) parts.push(`${stats.elapsed_s.toLocaleString(undefined, {maximumFractionDigits: 1})} s`);
    // A short prefill is dominated by fixed overhead, so its rate would only look misleadingly low.
    const fresh = stats.prompt ? stats.prompt - (stats.cached || 0) : Infinity;
    if (stats.prefill_tps && fresh >= 200) parts.push(`prefill ${rate(stats.prefill_tps)}`);
    if (stats.decode_tps) parts.push(`decode ${rate(stats.decode_tps)}`);
    else if (stats.approx_tps) parts.push(`≈${rate(stats.approx_tps)}`);
    if (stats.prompt) parts.push(`prompt ${stats.prompt}`);
    if (stats.completion) parts.push(`output ${stats.completion}`);
    if (stats.cached) parts.push(`cached ${stats.cached}`);
    if (stats.reasoning) parts.push(`thinking ${stats.reasoning}`);
    if (stats.search_s) parts.push(`search ${stats.search_s.toLocaleString(undefined, {maximumFractionDigits: 1})} s`);
    if (stats.stopped) parts.push('stopped');
    else if (stats.finish) parts.push(stats.finish);
    return parts.join(' · ');
  }

  function thinkingLabel(seconds, tokens) {
    const parts = ['Thinking'];
    if (seconds > 0) parts.push(`${seconds.toLocaleString(undefined, {maximumFractionDigits: seconds < 10 ? 1 : 0})} s`);
    if (tokens > 0) parts.push(`${tokens} tokens`);
    return parts.join(' · ');
  }

  const parseArgs = text => {
    try { const value = JSON.parse(text || '{}'); return value && typeof value === 'object' ? value : {}; } catch { return {}; }
  };

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return String(url || ''); }
  }

  function stepLabel(name, args) {
    if (name === 'web_search') return `🔍 Searching: ${args.query || ''}`;
    if (name === 'read_page') return `📄 Reading: ${hostOf(args.url)}`;
    return `🔧 ${name}`;
  }

  function assistantBox(message, live = false, last = false) {
    const box = document.createElement('div');
    box.className = 'message assistant';
    const details = document.createElement('details');
    details.open = live;
    details.hidden = !message.reasoning_content;
    details.innerHTML = '<summary></summary><div class="reasoning"></div>';
    details.querySelector('summary').textContent = thinkingLabel(message.stats?.reasoning_s, message.stats?.reasoning);
    details.querySelector('.reasoning').textContent = message.reasoning_content || '';
    const content = document.createElement('div');
    content.className = 'content';
    content.innerHTML = renderMarkdown(displayContent(message.content || ''));
    const steps = document.createElement('div');
    steps.className = 'steps';
    (message.tool_calls || []).forEach(call => {
      const line = document.createElement('div');
      line.textContent = stepLabel(call.function.name, parseArgs(call.function.arguments));
      steps.append(line);
    });
    const sources = document.createElement('div');
    sources.className = 'sources';
    sources.hidden = !message.sources?.length;
    if (message.sources?.length) {
      sources.append('Sources: ');
      message.sources.forEach(source => {
        const link = document.createElement('a');
        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = source.title || hostOf(source.url);
        sources.append(link);
      });
    }
    const waiting = document.createElement('div');
    waiting.className = 'waiting';
    waiting.hidden = !live || Boolean(message.content || message.reasoning_content);
    waiting.setAttribute('aria-label', 'Generating response');
    const stats = document.createElement('div');
    stats.className = 'stats';
    stats.textContent = statsText(message);
    stats.hidden = !stats.textContent;
    const actions = document.createElement('div');
    actions.className = 'actions';
    if (!live) {
      const copy = actionButton('Copy', () => copyText(message.content || '', copy));
      actions.append(copy);
      if (last) actions.append(actionButton('Regenerate', regenerate));
    }
    box.append(details, content, steps, sources, waiting, stats, actions);
    return box;
  }

  function addMessage(message, live = false, index = -1) {
    const box = message.role === 'assistant' ? assistantBox(message, live, index === messages.length - 1) : document.createElement('div');
    if (message.role !== 'assistant') {
      box.className = `message ${message.role}`;
      const {text, images} = userParts(message.content);
      if (text) {
        const content = document.createElement('div');
        content.className = 'user-text';
        content.textContent = text;
        box.append(content);
      }
      if (images.length) {
        const gallery = document.createElement('div');
        gallery.className = 'user-images';
        images.forEach(url => {
          const image = document.createElement('img');
          image.src = url;
          image.alt = 'Attached image';
          gallery.append(image);
        });
        box.append(gallery);
      }
      if (index >= 0) {
        const edit = actionButton('✎', () => startEdit(index, box), 'edit-msg');
        edit.title = 'Edit message';
        edit.setAttribute('aria-label', 'Edit message');
        box.append(edit);
      }
    }
    chat.append(box);
    scrollTo(0, document.body.scrollHeight);
    return box;
  }

  // Exact: the last reply's prompt plus completion tokens is the history the next turn starts from.
  function showContext() {
    const stats = messages.at(-1)?.role === 'assistant' ? messages.at(-1).stats : null;
    const used = stats?.prompt ? stats.prompt + (stats.completion || 0) : 0;
    ctxBox.hidden = !used;
    if (!used) return;
    const share = used / contextLimit;
    const thousands = value => (value / 1024).toLocaleString(undefined, {maximumFractionDigits: 1});
    ctxText.textContent = `${thousands(used)}K / ${thousands(contextLimit)}K`;
    ctxFill.style.width = `${Math.min(100, share * 100)}%`;
    ctxBox.className = share > 0.9 ? 'crit' : share > 0.75 ? 'warn' : '';
  }

  function renderChat() {
    showContext();
    chat.replaceChildren();
    document.body.classList.toggle('empty', !messages.length);
    if (!messages.length) {
      const empty = document.createElement('div');
      empty.id = 'empty';
      empty.textContent = 'How can I help?';
      chat.append(empty);
    } else messages.forEach((message, index) => { if (message.role !== 'tool') addMessage(message, false, index); });
  }

  function startEdit(index, box) {
    if (controller) return;
    const {text, images} = userParts(messages[index].content);
    const area = document.createElement('textarea');
    area.value = text;
    area.rows = Math.min(12, text.split('\n').length + 1);
    const save = () => {
      const value = area.value.trim();
      if (!value && !images.length) return;
      const content = images.length ? [
        ...(value ? [{type: 'text', text: value}] : []),
        ...images.map(url => ({type: 'image_url', image_url: {url}}))
      ] : value;
      // Earlier turns stay untouched so the server's prefix cache still matches them.
      messages.splice(index);
      messages.push({role: 'user', content});
      renderChat();
      run(null);
    };
    area.addEventListener('keydown', event => {
      if (event.isComposing || event.keyCode === 229) return;
      if (event.key === 'Escape') renderChat();
      else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); save(); }
    });
    const row = document.createElement('div');
    row.className = 'row';
    row.append(actionButton('Cancel', renderChat, 'btn'), actionButton('Save & regenerate', save, 'btn primary'));
    const editor = document.createElement('div');
    editor.className = 'editor';
    editor.append(area, row);
    const gallery = box.querySelector('.user-images');
    box.replaceChildren(editor, ...(gallery ? [gallery] : []));
    box.classList.add('editing');
    area.focus();
  }

  function regenerate() {
    if (controller || messages.at(-1)?.role !== 'assistant') return;
    // Drop the whole reply, including any tool steps back to the user turn.
    while (messages.length && messages.at(-1).role !== 'user') messages.pop();
    renderChat();
    run(null);
  }

  function renderRecents() {
    recents.replaceChildren();
    conversations.forEach(conversation => {
      const item = document.createElement('div');
      item.className = `recent${conversation.id === activeId ? ' active' : ''}${controller ? ' disabled' : ''}`;
      item.setAttribute('role', 'button');
      item.tabIndex = 0;
      const title = document.createElement('span');
      title.className = 'recent-title';
      title.textContent = conversation.title;
      const rename = actionButton('✎', event => { event.stopPropagation(); startRename(conversation, title); }, 'row-btn');
      rename.title = 'Rename chat';
      rename.setAttribute('aria-label', 'Rename chat');
      const remove = actionButton('×', event => { event.stopPropagation(); removeChat(conversation.id); }, 'row-btn');
      remove.title = 'Delete chat';
      remove.setAttribute('aria-label', 'Delete chat');
      item.append(title, rename, remove);
      item.addEventListener('click', () => openChat(conversation.id));
      item.addEventListener('keydown', event => {
        if (event.target === item && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); openChat(conversation.id); }
      });
      title.addEventListener('dblclick', () => startRename(conversation, title));
      recents.append(item);
    });
  }

  function startRename(conversation, title) {
    if (controller) return;
    const field = document.createElement('input');
    field.className = 'rename-input';
    field.value = conversation.title;
    field.setAttribute('aria-label', 'Chat title');
    let done = false;
    const finish = commit => {
      if (done) return;
      done = true;
      const value = field.value.replace(/\s+/g, ' ').trim().slice(0, 100);
      if (commit && value && value !== conversation.title) {
        conversation.title = value;
        save();
      } else renderRecents();
    };
    field.addEventListener('keydown', event => {
      event.stopPropagation();
      if (event.isComposing || event.keyCode === 229) return;
      if (event.key === 'Enter') { event.preventDefault(); finish(true); }
      else if (event.key === 'Escape') { event.preventDefault(); finish(false); }
    });
    field.addEventListener('blur', () => finish(true));
    field.addEventListener('click', event => event.stopPropagation());
    title.replaceWith(field);
    field.focus();
    field.select();
  }

  function removeChat(id) {
    if (controller) return;
    conversations = conversations.filter(conversation => conversation.id !== id);
    if (id === activeId) newChat();
    save();
  }

  function newChat() {
    if (controller) return;
    activeId = null;
    messages = [];
    system = storageGet(systemKey) || '';
    web = false;
    showSystem();
    showWeb();
    clearAttachments();
    document.body.classList.remove('menu-open');
    renderChat();
    renderRecents();
    input.focus();
  }

  function openChat(id) {
    if (controller) return;
    const conversation = conversations.find(item => item.id === id);
    if (!conversation) return;
    activeId = id;
    messages = conversation.messages;
    system = conversation.system || '';
    web = conversation.web === true;
    showSystem();
    showWeb();
    clearAttachments();
    document.body.classList.remove('menu-open');
    renderChat();
    renderRecents();
    input.focus();
  }

  function persist(firstPrompt) {
    let conversation = conversations.find(item => item.id === activeId);
    if (!conversation) {
      conversation = {id: chatId(), title: titleFor(firstPrompt), messages, system, web, updated: Date.now()};
      conversations.push(conversation);
      activeId = conversation.id;
    }
    conversation.messages = messages;
    conversation.system = system;
    conversation.web = web;
    conversation.updated = Date.now();
    save();
  }

  function resize() {
    input.style.height = 'auto';
    input.style.height = `${input.scrollHeight}px`;
  }

  function renderAttachments() {
    attachmentsBox.replaceChildren();
    attachments.forEach(attachment => {
      const item = document.createElement('div');
      item.className = 'attachment';
      const name = attachment.name || 'Attached image';
      item.title = name;
      const preview = document.createElement(attachment.url ? 'img' : 'span');
      if (attachment.url) {
        preview.src = attachment.url;
        preview.alt = name;
      } else {
        preview.className = `attachment-status${attachment.error ? ' error' : ''}`;
        preview.textContent = attachment.error ? 'Read failed' : 'Loading…';
        preview.setAttribute('role', 'status');
      }
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove-image';
      remove.setAttribute('aria-label', `Remove ${name}`);
      remove.textContent = '\u00d7';
      remove.addEventListener('click', () => {
        attachments = attachments.filter(value => value !== attachment);
        renderAttachments();
      });
      item.append(preview, remove);
      attachmentsBox.append(item);
    });
    updateComposer();
  }

  function clearAttachments() {
    attachments = [];
    imageInput.value = '';
    renderAttachments();
  }

  function readImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  async function addImages(files) {
    const images = Array.from(files).filter(file => file.type.startsWith('image/'));
    if (!images.length) return;
    // Readers update stable entries, even if rollback moves them to a new draft.
    const selected = images.map(file => ({name: file.name, url: null, error: false}));
    attachments.push(...selected);
    renderAttachments();
    await Promise.all(images.map(async (file, index) => {
      const attachment = selected[index];
      try {
        attachment.url = await readImage(file);
      } catch {
        attachment.error = true;
      }
      if (attachments.includes(attachment)) renderAttachments();
    }));
  }

  function canSend() {
    return Boolean(input.value.trim() || attachments.length) &&
      attachments.every(attachment => attachment.url);
  }

  function updateComposer() {
    send.disabled = !controller && !canSend();
  }

  function setRunning(running) {
    send.textContent = running ? '\u25a0' : '\u2191';
    send.setAttribute('aria-label', running ? 'Stop' : 'Send');
    effort.disabled = running;
    webButton.disabled = running;
    attach.disabled = running;
    $('#new-chat').disabled = running;
    $('#mobile-new').disabled = running;
    renderRecents();
    updateComposer();
  }

  function consume(event, assistant, state, repaint) {
    const data = event.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('\n');
    if (!data || data === '[DONE]') return data === '[DONE]';
    const chunk = JSON.parse(data);
    if (chunk.error) throw new Error(chunk.error.message);
    if (chunk.usage) state.usage = chunk.usage;
    if (chunk.timings) state.timings = chunk.timings;
    if (chunk.metrics) state.latency = chunk.metrics.request_latency;
    if (chunk.choices?.[0]?.finish_reason) state.finish = chunk.choices[0].finish_reason;
    const delta = chunk.choices?.[0]?.delta;
    // A chunk without text or a call has nothing to show or scroll to.
    if (!delta?.reasoning_content && !delta?.content && !delta?.tool_calls) return false;
    state.first ||= Date.now();
    if (modelState !== 'loaded') showModel('loaded');
    // Thinking time runs from the first reasoning delta to the first answer delta.
    if (delta.reasoning_content) state.reasonStart ||= Date.now();
    if (delta.content && state.reasonStart) state.reasonEnd ||= Date.now();
    if (delta.reasoning_content) assistant.reasoning_content += delta.reasoning_content;
    if (delta.content) assistant.content += delta.content;
    for (const call of delta.tool_calls || []) {
      const slot = (assistant.tool_calls ||= [])[call.index ?? 0] ||= {id: '', type: 'function', function: {name: '', arguments: ''}};
      if (call.id) slot.id = call.id;
      if (call.function?.name) slot.function.name += call.function.name;
      if (call.function?.arguments) slot.function.arguments += call.function.arguments;
    }
    repaint();
    return false;
  }

  // Exact numbers from the final chunk; missing fields are simply omitted.
  function serverStats(state) {
    const stats = {};
    const put = (key, value) => {
      const number = Number(value);
      if (Number.isFinite(number) && number > 0) stats[key] = number;
    };
    put('ttft_ms', state.latency?.ttft_ms);
    put('prefill_tps', state.timings?.prompt_per_second);
    put('decode_tps', state.timings?.predicted_per_second || state.latency?.stream_tokens_per_second);
    put('prompt', state.usage?.prompt_tokens);
    put('completion', state.usage?.completion_tokens);
    put('cached', state.usage?.prompt_tokens_details?.cached_tokens);
    put('reasoning', state.usage?.completion_tokens_details?.reasoning_tokens);
    if (state.reasonStart) put('reasoning_s', ((state.reasonEnd || Date.now()) - state.reasonStart) / 1000);
    if (state.finish === 'length') stats.finish = 'length';
    return stats;
  }

  async function complete() {
    if (controller || !canSend()) return;
    const text = input.value.trim();
    const pendingAttachments = attachments;
    const content = pendingAttachments.length ? [
      ...(text ? [{type: 'text', text}] : []),
      ...pendingAttachments.map(attachment => ({type: 'image_url', image_url: {url: attachment.url}}))
    ] : text;
    input.value = '';
    attachments = [];
    renderAttachments();
    resize();
    document.body.classList.remove('empty');
    $('#empty')?.remove();
    messages.push({role: 'user', content});
    addMessage(messages.at(-1), false, messages.length - 1);
    await run({content, text, attachments: pendingAttachments, title: text || pendingAttachments[0]?.name || 'Image'});
  }

  async function webCall(kind, body) {
    const response = await fetch(`/splash/tools/${kind}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', ...authorization()},
      body: JSON.stringify(body),
      signal: controller.signal
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error?.message || response.statusText);
    return data;
  }

  const clip = (text, length) => text.length > length ? `${text.slice(0, length - 1)}…` : text;

  // Runs one tool call under the per-turn limits; failures go back to the model as text.
  async function runTool(call, steps, turn) {
    const {name} = call.function;
    const args = parseArgs(call.function.arguments);
    const line = document.createElement('div');
    line.textContent = stepLabel(name, args);
    steps.append(line);
    const started = Date.now();
    let content;
    try {
      if (name === 'web_search') {
        if (turn.searches >= maxSearches) content = `Error: search limit (${maxSearches}) reached. Answer using what you have already found.`;
        else if (typeof args.query !== 'string' || !args.query.trim()) content = 'Error: query must be a non-empty string.';
        else {
          turn.searches++;
          turn.query = args.query;
          const {results = []} = await webCall('search', {query: args.query});
          turn.results.push(...results);
          content = results.length
            ? results.map((item, index) => `${index + 1}. ${item.title}\n${item.url}\n${clip(item.snippet || '', 150)}`).join('\n\n')
            : 'No results found.';
        }
      } else if (name === 'read_page') {
        if (turn.reads >= maxReads) content = 'Error: only one page can be read per answer. Answer using what you have already read.';
        else if (typeof args.url !== 'string' || !args.url.trim()) content = 'Error: URL is required.';
        else {
          turn.reads++;
          const page = await webCall('fetch', {url: args.url, ...(turn.query ? {query: turn.query} : {})});
          turn.pages.push({title: page.title || '', url: page.url});
          content = `Source: ${page.url}\nTitle: ${page.title || ''}\n\n${page.text}${page.truncated ? '\n\n[Text truncated]' : ''}`;
        }
      } else content = `Error: unknown tool ${name}.`;
    } catch (error) {
      if (error.name === 'AbortError') throw error;
      content = `Error: ${error.message}`;
    }
    turn.ms += Date.now() - started;
    return {role: 'tool', tool_call_id: call.id, content};
  }

  // Streams one model call. `cur` receives the live assistant, box and state so the caller can settle a stop or failure.
  async function streamReply(cur, tools, first) {
    const assistant = {role: 'assistant', content: '', reasoning_content: ''};
    const box = addMessage(assistant, true);
    const parts = {details: box.querySelector('details'), summary: box.querySelector('summary'), reasoning: box.querySelector('.reasoning'),
      content: box.querySelector('.content'), waiting: box.querySelector('.waiting'), stats: box.querySelector('.stats'), steps: box.querySelector('.steps')};
    const state = {start: Date.now(), first: 0};
    Object.assign(cur, {assistant, box, parts, state});
    let queued = false;
    const paintStats = () => {
      if (state.reasonStart) parts.summary.textContent = thinkingLabel(((state.reasonEnd || Date.now()) - state.reasonStart) / 1000);
      // Before the first token the wait belongs to the model panel, not the message.
      if (!state.first) return;
      const now = Date.now();
      let line = `${((now - state.first) / 1000).toFixed(1)} s`;
      if (now - state.first > 500) line += ` · ≈${rate(estimateTokens(assistant) * 1000 / (now - state.first))}`;
      parts.stats.textContent = line;
      parts.stats.hidden = false;
    };
    const paint = () => {
      queued = false;
      if (assistant.content || assistant.reasoning_content) parts.waiting.hidden = true;
      if (assistant.reasoning_content) {
        parts.details.hidden = false;
        parts.reasoning.textContent = assistant.reasoning_content;
      }
      parts.content.innerHTML = renderMarkdown(displayContent(assistant.content));
      paintStats();
      if (follow) scrollTo(0, document.documentElement.scrollHeight);
    };
    const repaint = () => {
      if (queued) return;
      queued = true;
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(paint);
      else paint();
    };
    const timer = typeof setInterval === 'function' ? setInterval(() => { paintStats(); paintPanel(); }, 250) : 0;
    try {
      paintStats();
      if (first) toBottom();
      const response = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...authorization()},
        body: JSON.stringify(requestBody(tools)),
        signal: controller.signal
      });
      if (!response.ok) throw new Error((await response.json()).error?.message || response.statusText);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let doneEvent = false;
      while (true) {
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop();
        events.forEach(event => { doneEvent ||= consume(event, assistant, state, repaint); });
        if (done) break;
      }
      if (buffer) doneEvent ||= consume(buffer, assistant, state, repaint);
      if (!doneEvent) throw new Error('Connection closed early');
      const stats = serverStats(state);
      if (Object.keys(stats).length) assistant.stats = stats;
      if (stats.decode_tps) assistant.tps = stats.decode_tps;
      return assistant;
    } finally {
      if (timer) clearInterval(timer);
    }
  }

  // Sources of a web answer: the page read plus any search result the answer links.
  function turnSources(turn, answer) {
    const all = [...turn.pages, ...turn.results.filter(item => answer.includes(item.url)).map(item => ({title: item.title, url: item.url}))];
    return cleanSources(all.filter((item, index) => all.findIndex(other => other.url === item.url) === index));
  }

  // Streams a reply to the history in `messages`, which already ends with the user turn.
  // With web on, tool calls are run and the model is called again until it answers.
  // `draft` is set when that turn came from the composer, so a failure can hand it back.
  async function run(draft) {
    const base = messages.length;
    const turn = {searches: 0, reads: 0, ms: 0, query: '', results: [], pages: [], rounds: 0};
    const cur = {};
    unloadAt = 0;
    controller = new AbortController();
    setRunning(true);
    if (modelState !== 'loaded') {
      showModel('loading');
      loadingSince = Date.now();
      paintPanel();
    }
    // Search time is reported on the final message.
    const finish = assistant => {
      if (turn.ms > 0) assistant.stats = {...assistant.stats, search_s: turn.ms / 1000};
      const sources = turnSources(turn, assistant.content);
      if (sources.length) assistant.sources = sources;
      messages.push(assistant);
      persist(draft?.title);
      renderChat();
    };
    try {
      while (true) {
        const assistant = await streamReply(cur, web && turn.rounds++ < maxRounds, !cur.assistant);
        const calls = (assistant.tool_calls || []).filter(Boolean);
        if (!calls.length) {
          delete assistant.tool_calls;
          finish(assistant);
          break;
        }
        calls.forEach((call, index) => { call.id ||= `call_${turn.rounds}_${index}`; });
        assistant.tool_calls = calls;
        const results = [];
        for (const call of calls) results.push(await runTool(call, cur.parts.steps, turn));
        // Pushed together, so a stop never leaves a call without its result.
        messages.push(assistant, ...results);
        renderChat();
      }
    } catch (error) {
      const aborted = error.name === 'AbortError';
      const assistant = cur.assistant;
      if (assistant) delete assistant.tool_calls;
      if (aborted && (assistant?.content || assistant?.reasoning_content || messages.length > base)) {
        // Stop keeps what was generated so far.
        const elapsed = (Date.now() - cur.state.start) / 1000;
        assistant.stats = {...serverStats(cur.state), stopped: true, elapsed_s: elapsed};
        if (turn.ms > 0) assistant.stats.search_s = turn.ms / 1000;
        if (cur.state.first && Date.now() - cur.state.first > 500) assistant.stats.approx_tps = estimateTokens(assistant) * 1000 / (Date.now() - cur.state.first);
        messages.push(assistant);
        persist(draft?.title);
        renderChat();
      } else {
        cur.box?.remove();
        // A failed reply leaves no half-done tool steps behind.
        messages.length = base;
        if (draft) {
          messages.pop();
          renderChat();
          if (input.value === '') input.value = draft.text;
          // Restore the submitted entries alongside the next draft's pending reads.
          attachments.unshift(...draft.attachments);
          renderAttachments();
          resize();
        }
        if (!aborted) {
          const note = addMessage({role: 'assistant', content: error.message});
          note.classList.add('error');
          note.querySelector('.actions').replaceChildren(actionButton('Retry', () => {
            if (controller) return;
            note.remove();
            if (draft) {
              if (input.value === draft.text) { input.value = ''; resize(); }
              attachments = attachments.filter(attachment => !draft.attachments.includes(attachment));
              renderAttachments();
              messages.push({role: 'user', content: draft.content});
              document.body.classList.remove('empty');
              $('#empty')?.remove();
              addMessage(messages.at(-1), false, messages.length - 1);
            }
            run(draft);
          }));
        }
      }
    } finally {
      controller = undefined;
      jump.hidden = true;
      setRunning(false);
      input.focus();
      pollModel();
    }
  }

  chat.addEventListener('click', event => {
    const button = event.target.closest?.('.copy-code');
    if (button) copyText(button.closest('.code').querySelector('code').textContent, button);
  });
  form.addEventListener('submit', event => { event.preventDefault(); controller ? controller.abort() : complete(); });
  function showWeb() {
    webButton.setAttribute('aria-pressed', String(web));
  }
  webButton.addEventListener('click', () => {
    web = !web;
    showWeb();

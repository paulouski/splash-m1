    const conversation = conversations.find(item => item.id === activeId);
    if (conversation) { conversation.web = web; save(); }
  });
  effort.addEventListener('change', () => {
    storageSet(effortKey, effort.value);
  });
  function toggleSettings(open) {
    settings.hidden = !open;
    gear.setAttribute('aria-expanded', String(open));
    if (open) { showSampling(); showSystem(); }
  }

  settings.hidden = true;
  gear.addEventListener('click', () => toggleSettings(settings.hidden));
  document.addEventListener('click', event => {
    if (!settings.hidden && !event.target.closest?.('#settings, #gear')) toggleSettings(false);
  });
  settings.addEventListener('keydown', event => {
    if (event.key === 'Escape') { toggleSettings(false); gear.focus(); }
    else if (event.key === 'Enter' && event.target.tagName === 'INPUT') event.preventDefault();
  });
  for (const key of Object.keys(fields)) {
    const range = $(`#s-${key}`);
    const number = $(`#s-${key}-n`);
    const update = source => {
      changeSampling({[key]: clampField(key, source.value) ?? serverDefaults[key] ?? null});
    };
    // Typing in the number box leaves its own text alone until it loses focus.
    range?.addEventListener('input', () => update(range));
    number.addEventListener('input', () => {
      const value = clampField(key, number.value) ?? serverDefaults[key] ?? null;
      sampling[key] = value;
      if (range) range.value = value;
      storageSet(samplingKey, JSON.stringify(sampling));
      gearLabel.textContent = `T ${sampling.temperature}`;
    });
    number.addEventListener('change', () => { number.value = sampling[key] ?? ''; });
  }
  for (const [name, values] of Object.entries(presets)) $(`#preset-${name}`).addEventListener('click', () => changeSampling(values));
  $('#preset-reset').addEventListener('click', () => changeSampling({...serverDefaults, max_tokens: null, seed: null}));
  systemInput.addEventListener('input', () => {
    system = systemInput.value;
    const conversation = conversations.find(item => item.id === activeId);
    if (conversation) conversation.system = system;
    systemHint.hidden = !messages.length;
  });
  systemInput.addEventListener('change', () => { if (conversations.some(item => item.id === activeId)) save(); });
  $('#s-system-default').addEventListener('click', () => storageSet(systemKey, system));
  attach.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    if (imagesAccepted) addImages(imageInput.files).catch(console.error);
    imageInput.value = '';
  });
  input.addEventListener('paste', event => {
    // Without image input the browser pastes as usual.
    if (!imagesAccepted) return;
    const images = Array.from(event.clipboardData?.items || [])
      .filter(item => item.type.startsWith('image/'))
      .map(item => item.getAsFile())
      .filter(Boolean);
    if (!images.length) return;
    if (!event.clipboardData.getData('text/plain')) event.preventDefault();
    addImages(images).catch(console.error);
  });
  input.addEventListener('input', () => { resize(); updateComposer(); });
  input.addEventListener('keydown', event => {
    // Safari can end composition before the confirming Enter keydown.
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); complete(); }
  });
  apiKey.addEventListener('change', () => { loadModalities(); pollModel(); });
  idleSelect.addEventListener('change', saveIdle);
  jump.addEventListener('click', toBottom);
  addEventListener('scroll', onScroll, {passive: true});
  document.addEventListener('visibilitychange', pollModel);
  if (typeof setInterval === 'function') { setInterval(pollModel, 5000); setInterval(paintPanel, 1000); }
  $('#new-chat').addEventListener('click', newChat);
  $('#mobile-new').addEventListener('click', newChat);
  $('#menu').addEventListener('click', () => document.body.classList.add('menu-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
  // KaTeX is deferred, so history rendered before it loaded is repainted once it is there.
  addEventListener('load', () => { if (typeof katex !== 'undefined' && !controller) renderChat(); });
  showSampling();
  showSystem();
  showWeb();
  renderChat();
  renderRecents();
  updateComposer();
  loadModalities();
  pollModel();
</script>
</html>

name: Splash runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  engine-check:
    name: Production and CPU runtime checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MACOS15: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Build production and run CPU runtime checks
        run: make check-source check-native-cpu PYTHON_CANDIDATES=python3

  python-check:
    name: Python runtime checks
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MACOS15: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            dev/requirements.txt
      - name: Run current runtime Python, model-manifest, and source checks
        run: make check-python-engine PYTHON_CANDIDATES=python3
